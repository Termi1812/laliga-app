<div class="app">

  <header class="header">
    <div class="logo">
      <img src="logos/laliga.png" class="logo-img"/>
      <span class="logo-text">{{ textos.header.logo }}</span>
    </div>
    <nav>
      <a routerLink="/clasificacion">{{ textos.nav.clasificacion }}</a>
      <a routerLink="/partidos">{{ textos.nav.partidos }}</a>
      <a class="active">{{ textos.nav.equipos }}</a>
    </nav>
    <div class="season">🏆 {{ textos.header.temporada }}</div>
  </header>

  <main class="container">
    <h1>{{ textos.equipos.titulo }}</h1>

    <div class="equipos-grid">
      @for (equipo of equipos; track equipo.id) {
        <div class="equipo-card" [routerLink]="['/equipos', equipo.id]">
          <img [src]="equipo.escudo" class="escudo" [alt]="equipo.nombre"/>
          <span class="nombre">{{ equipo.nombre }}</span>
          <span class="estadio">{{ equipo.estadio }}</span>
        </div>
      }
    </div>

  </main>
</div>
